# =============================================
# HMS-AI Backend – DEV Profile
# =============================================
spring:
  datasource:
    # Mặc định nối MySQL trên máy (localhost:3306). Đổi bằng MYSQL_HOST/MYSQL_PORT/MYSQL_DB hoặc đặt cả SPRING_DATASOURCE_URL.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:hmsai_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${MYSQL_USER:hmsai_user}
    password: ${MYSQL_PASSWORD:hmsai_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

# Dev JWT Secret fallback
jwt:
  secret: ${JWT_SECRET:s8GqRwLy15kENaTDsis74W4hXUKSTKhaKky0yKIByzs=}

# Tài khoản VietQR DEMO cho môi trường dev – giao diện hiển thị cảnh báo "không chuyển tiền thật"
billing:
  vietqr:
    bank-bin: ${VIETQR_BANK_BIN:970422}
    bank-name: ${VIETQR_BANK_NAME:MB Bank (DEMO)}
    account-no: ${VIETQR_ACCOUNT_NO:0000000000}
    account-name: ${VIETQR_ACCOUNT_NAME:MY PHAT HOSPITAL DEMO}
    demo: true

# Logging
logging:
  level:
    com.hospital.hmsai: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
