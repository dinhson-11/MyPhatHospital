# =============================================
# HMS-AI Backend – DEV Profile
# =============================================
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hmsai_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${MYSQL_USER:hmsai_user}
    password: ${MYSQL_PASSWORD:hmsai_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

# Dev JWT Secret fallback
jwt:
  secret: ${JWT_SECRET:s8GqRwLy15kENaTDsis74W4hXUKSTKhaKky0yKIByzs=}

# Logging
logging:
  level:
    com.hospital.hmsai: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
