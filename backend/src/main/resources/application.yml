# =============================================
# HMS-AI Backend – Common Configuration
# =============================================
spring:
  application:
    name: hmsai-backend

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate    # Flyway quản lý schema, Hibernate chỉ validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Jackson
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Ho_Chi_Minh
    date-format: yyyy-MM-dd HH:mm:ss

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: 1800000          # 30 phút (milliseconds)
  refresh-expiration: 604800000  # 7 ngày (milliseconds)

# AI Service
ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:8000}
  timeout: 3000   # 3 giây (NFR-3)

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Server
server:
  port: 8080
  servlet:
    context-path: /
