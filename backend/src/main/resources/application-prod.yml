# =============================================
# HMS-AI Backend – PROD Profile
# =============================================
spring:
  datasource:
    # Kết nối tới CSDL thật qua biến môi trường (host/cổng/tên DB/tài khoản không đặt cứng trong mã).
    # MYSQL_SSL_MODE: DISABLED | PREFERRED (mặc định: mã hóa nếu máy chủ hỗ trợ) | REQUIRED | VERIFY_CA | VERIFY_IDENTITY
    #   -> DB cloud/production nên dùng REQUIRED hoặc VERIFY_*.
    # MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL=true chỉ cần khi KHÔNG dùng SSL với tài khoản caching_sha2_password.
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:hmsai_db}?sslMode=${MYSQL_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:false}&serverTimezone=Asia/Ho_Chi_Minh&connectTimeout=10000
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

# Logging
logging:
  level:
    com.hospital.hmsai: INFO
    org.springframework.security: WARN
    root: WARN
