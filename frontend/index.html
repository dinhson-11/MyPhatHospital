<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mỹ Phát Hospital – Hệ thống Y tế & Quản lý Bệnh viện Thông minh</title>
    <meta name="description" content="Mỹ Phát Hospital (1170 Quang Trung, Thị Trấn Chũ, Lục Ngạn, Bắc Giang) – Đặt lịch khám trực tuyến, tư vấn triệu chứng AI 24/7, hotline liên hệ 0789 065 493." />
    <meta name="theme-color" content="#0B5394" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Font (Be Vietnam Pro, Material Symbols) được đóng gói cùng ứng dụng (xem src/main.jsx) – không cần Internet. -->

    <!-- Màn hình chờ hiển thị ngay khi tải trang (trước khi JS sẵn sàng) – React sẽ thay thế nội dung #root -->
    <style>
      .app-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f6f8fa;
        color: #0f172a;
        font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .app-splash img { width: 72px; height: 72px; border-radius: 9999px; background: #fff; box-shadow: 0 1px 3px rgb(15 23 42 / 0.12); }
      .app-splash-title { margin: 0; font-size: 18px; font-weight: 700; color: #0B5394; letter-spacing: 0.02em; }
      .app-splash-text { margin: 0; font-size: 14px; color: #475569; }
      .app-splash-bar { width: 160px; height: 4px; border-radius: 9999px; background: #d6e7f8; overflow: hidden; position: relative; }
      .app-splash-bar::after {
        content: ''; position: absolute; inset: 0; width: 40%; border-radius: 9999px; background: #0B5394;
        animation: app-splash-move 1.1s ease-in-out infinite;
      }
      @keyframes app-splash-move { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .app-splash-bar::after { animation: none; width: 100%; } }
    </style>

  </head>
  <body class="bg-canvas text-on-surface antialiased">
    <div id="root">
      <div class="app-splash" role="status" aria-live="polite">
        <img src="/logo.png" alt="" width="72" height="72" />
        <p class="app-splash-title">MỸ PHÁT HOSPITAL</p>
        <div class="app-splash-bar" aria-hidden="true"></div>
        <p class="app-splash-text">Đang tải hệ thống, vui lòng chờ trong giây lát…</p>
      </div>
    </div>
    <noscript>
      <p style="padding:16px;font-family:system-ui,sans-serif">Vui lòng bật JavaScript để sử dụng hệ thống Mỹ Phát Hospital. Hotline: 0789 065 493.</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
