<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mỹ Phát Hospital – Hệ thống Y tế & Quản lý Bệnh viện Thông minh</title>
    <meta name="description" content="Mỹ Phát Hospital (1170 Quang Trung, Thị Trấn Chũ, Lục Ngạn, Bắc Giang) – Đặt lịch khám trực tuyến, tư vấn triệu chứng AI 24/7, hotline liên hệ 0789 065 493." />
    <meta name="theme-color" content="#0B5394" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Typography: Be Vietnam Pro + Inter – optimized for Vietnamese -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS CDN – HMS Design System tokens -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              /* Brand – Medical Navy Blue (#0B5394) & Hospital Teal (#2BA89B) */
              "brand": {
                50: "#f0f7ff",
                100: "#e0effe",
                200: "#bae0fd",
                300: "#7cc7fb",
                400: "#36aaf5",
                500: "#0b8ee0",
                600: "#0b5394",
                700: "#0a457c",
                800: "#0c3b66",
                900: "#0f3254",
                950: "#0a2038"
              },
              "primary": "#0B5394",
              "primary-dark": "#083e70",
              "primary-container": "#1565a8",
              "primary-fixed": "#eef5fc",
              "primary-fixed-dim": "#d2e4f7",
              "teal": {
                50: "#f0fdfa",
                100: "#ccfbf1",
                200: "#99f6e4",
                300: "#5eead4",
                400: "#2dd4bf",
                500: "#2BA89B",
                600: "#22867c",
                700: "#1d6c64",
                800: "#1c5651",
                900: "#1b4743"
              },
              "secondary": "#2BA89B",
              "secondary-dark": "#22867c",
              "secondary-container": "#eaf7f5",
              "secondary-fixed": "#eaf7f5",

              "on-primary-container": "#ffffff",
              "on-secondary": "#ffffff",
              "tertiary": "#2BA89B",
              "tertiary-fixed": "#eaf7f5",
              /* Surfaces & neutrals (slate based) */
              "canvas": "#f6f8fa",
              "surface": "#ffffff",
              "surface-bright": "#ffffff",
              "surface-dim": "#f1f5f9",
              "surface-variant": "#94a3b8",
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#f8fafc",
              "surface-container": "#f1f5f9",
              "surface-container-high": "#e2e8f0",
              "surface-container-highest": "#cbd5e1",
              "on-surface": "#0f172a",
              "on-surface-variant": "#475569",
              "outline": "#94a3b8",

              "success": "#107c41",
              "success-container": "#edf7ed",
              "warning": "#d83b01",

              "label": ["'Be Vietnam Pro'", "'Inter'", "system-ui", "sans-serif"],

              "control": "10px"

  </head>
  <body class="bg-canvas text-on-surface antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
